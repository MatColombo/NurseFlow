name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- e2e/journeys/backup.visual.spec.ts e2e/journeys/builder.spec.ts e2e/journeys/portability.visual.spec.ts --grep "settings/full diff.*320px 48pt|Builder e sheet.*48pt|F13 Page11A.*320px 48pt" --workers=1
      - name: Report Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Artefatto statico verificato
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  visual:
    name: Visual components (Windows / Chromium)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --project=chromium --grep '@visual'
      - name: Report visuale
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 7
